name: CI

# Repositorio público: GitHub Actions no tiene límite de minutos. Corre en cada PR, al fusionar en
# main y a mano. No publica nada: solo compila y prueba.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Privacidad (nada privado ni de seguimiento en el repositorio)
        run: npm run privacidad

      - name: Tipos (astro check)
        run: npm run check

      - name: Compilar
        run: npm run build

      - name: Accesibilidad con axe (WCAG 2.1 AA) y sin terceros
        run: npm run test:a11y

      - name: Lighthouse en celular (rendimiento ≥ 90)
        run: npm run lighthouse

      - name: Guardar informes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes
          path: informes/
          retention-days: 14
